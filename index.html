<!doctype html>
<html lang="ko">
<head>

  <title>프랑스어 발음 카드 아카이브</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#eef2ff;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#fff 0,#eef2ff 72%)}

    h2{font-size:1.1rem;margin:0 0 12px}.entry{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #e7eaf1;padding:15px 0}.entry:first-of-type{border-top:0}

    footer{font-size:.88rem;color:#596579;line-height:1.55}
  </style>
</head>
